<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passkey Auth Example</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 400px;
            margin: 40px auto;
            padding: 20px;
        }
        input {
            display: block;
            margin: 8px 0;
            padding: 8px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            padding: 8px 16px;
            margin: 4px 4px 4px 0;
            cursor: pointer;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            min-height: 50px;
        }
    </style>
</head>
<body>
    <h1>Passkey Auth Example</h1>

    <div id="unauthorized-form">
        <h2>Login</h2>
        
        <p style="color: gray;">Not authenticated, click login to authenticate.</p>
    
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Password</th>
                    <th>Email</th>
                    <th>Passkey Enabled</th>
                </tr>
            </thead>
            <tbody id="users-table-body">
            </tbody>
        </table>

        <input type="text" id="username" placeholder="Username" value="alice" />
        <input type="password" id="password" placeholder="Password" value="alice123" />

        <button id="login-btn">Password Login</button>

        <hr />
        <button id="login-passkey-btn">Passkey Login</button>
        <div id="passkey-login-form" style="padding: 1rem; border: 1px solid #ccc; margin-top: 1rem; display: none;">
            <p style="color: gray;">Login with Passkey and WebAuthn</p>
            <input type="text" id="passkey-login-username" placeholder="Passkey Username" value="" />
            <button id="login-username-passkey-btn">Passkey Login With Username</button>
        </div>

        <hr />
        <button id="toggle-register-passkey-btn">Passkey Registration</button>
        <div id="passkey-register-form" style="padding: 1rem; border: 1px solid #ccc; margin-top: 1rem; display: none;">
            <p style="color: gray;">Register a new user with Passkey and WebAuthn</p>
            <input type="text" id="passkey-username" placeholder="Username" value="" />
            <input type="text" id="passkey-display" placeholder="Display Name" value="" />
            <input type="text" id="passkey-email" placeholder="Email" value="" />
            <input type="text" id="passkey-device" placeholder="Device" value="" />
            <button id="register-passkey-btn">Register</button>
        </div>
        <hr />
        <div id="unauthorized-result" class="result"></div>
    </div>

    <div id="authorized-form">
        <h2></h2>
        <button id="whoami-btn">Who Am I?</button>
        <button id="logout-btn">Logout</button>
        <hr />
        <div id="passkey-enabled">
            <p style="color: gray;">You have a passkey already registered.</p>
        </div>
        <div id="passkey-disabled">
            <button id="add-passkey-btn">Add Passkey</button>
        </div>
        <hr />
        <div id="authorized-result" class="result"></div>
    </div>

    <script>
        window.user = { userId: {user_id}, username: {username}, email: {email} };
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
