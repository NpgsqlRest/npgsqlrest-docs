<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Auth Example</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 400px;
            margin: 40px auto;
            padding: 20px;
        }
        input {
            display: block;
            margin: 8px 0;
            padding: 8px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            padding: 8px 16px;
            margin: 4px 4px 4px 0;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            min-height: 50px;
        }
    </style>
</head>
<body>
    <h1>Simple Auth Example</h1>

    <div id="auth-status"></div>

    <div id="login-form">
        <h2>Login</h2>
        <p>
            Try one of the following credentials:
        </p>
        <p>
            Username <strong><code>alice</code></strong> and password <strong><code>password123</code></strong>
        </p>
        <p>
            Username <strong><code>bob</code></strong> and password <strong><code>password456</code></strong>
        </p>
        <input type="text" id="username" placeholder="Username" value="alice" />
        <input type="password" id="password" placeholder="Password" value="password123" />
        <button id="login-btn">Login</button>
    </div>

    <div id="actions">
        <button id="whoami-btn">Who Am I?</button>
        <button id="logout-btn">Logout</button>
    </div>

    <div id="result"></div>

    <script>
        window.user = { userId: {user_id}, username: {username}, email: {email} };
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
