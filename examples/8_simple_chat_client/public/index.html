<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example 8: Simple Chat Client</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }
        .card {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 20px;
            margin: 15px 0;
        }
        input[type="text"],
        input[type="password"] {
            display: block;
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            margin: 5px 5px 5px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-login { background: #2196F3; color: white; }
        .btn-logout { background: #f44336; color: white; }
        .btn-send { background: #4CAF50; color: white; }
        .hidden { display: none; }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: #fafafa;
            border: 1px solid #ddd;
            border-radius: 4px;
            white-space: pre-wrap;
            font-family: monospace;
        }
        .credentials {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        #chat-messages {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
            background: white;
            margin-bottom: 15px;
        }
        .message {
            padding: 8px 12px;
            margin: 5px 0;
            border-radius: 8px;
            background: #e3f2fd;
        }
        .message .meta {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }
        .message .meta .username {
            font-weight: bold;
            color: #1976d2;
        }
        .message .text {
            word-wrap: break-word;
        }
        .message-input-container {
            display: flex;
            gap: 10px;
        }
        .message-input-container input {
            flex: 1;
            margin: 0;
        }
        .message-input-container button {
            margin: 0;
        }
        #connection-status {
            font-size: 12px;
            padding: 5px 10px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 10px;
        }
        .status-connected {
            background: #c8e6c9;
            color: #2e7d32;
        }
        .status-disconnected {
            background: #ffcdd2;
            color: #c62828;
        }
    </style>
</head>
<body>
    <h1>Example 8: Simple Chat Client</h1>

    <div id="auth-status"></div>

    <!-- Login Section -->
    <div id="login-section" class="card">
        <h2>Login</h2>
        <div class="credentials">
            <strong>alice</strong> / password123 | <strong>bob</strong> / password456
        </div>
        <input type="text" id="username" placeholder="Username" value="alice" />
        <input type="password" id="password" placeholder="Password" value="password123" />
        <button id="login-btn" class="btn-login">Login</button>
    </div>

    <!-- Chat Section for Authenticated Users -->
    <div id="chat-section" class="card hidden">
        <h2>Chat Room</h2>
        <div id="connection-status" class="status-disconnected">Disconnected</div>
        <div id="chat-messages"></div>
        <div class="message-input-container">
            <input type="text" id="message-input" placeholder="Type a message..." />
            <button id="send-btn" class="btn-send">Send</button>
        </div>
        <button id="logout-btn" class="btn-logout" style="margin-top: 15px;">Logout</button>
    </div>

    <div id="result"></div>

    <script>
        window.user = { userId: {user_id}, username: {user_name} };
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
